<text x="663.00" y="243.00" class="" text-anchor="start">1.73x (13/13)</text>
<text x="786.00" y="243.00" class="" text-anchor="start">13 / 0 / 0 / 0</text>
<rect x="434.40" y="274" width="131.16" height="16" rx="3" fill="#b67418"/>
<circle cx="565.56" cy="282" r="4" fill="#b67418"/>
