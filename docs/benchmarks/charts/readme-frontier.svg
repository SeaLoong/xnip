<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="414" viewBox="0 0 1000 414" role="img" aria-labelledby="title desc">
<title id="title">Best observed editing input</title><desc id="desc">Four xnip transport and candidate-permission groups compare the geometric mean of native best executor input divided by xnip best executor input on byte-exact tasks. Guarded-only and snapshot-enabled (guarded plus snapshot) pools apply identical candidate permissions on both sides. Above one means less xnip input. Counts show xnip-shorter, tied, native-shorter and missing tasks. Native candidates may span transports; CLI invocation overhead is extra. This is not a full agent usage or global optimum result.</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#192b3a;font-size:13px}.small{font-size:11px;fill:#526575}.title{font-size:21px;font-weight:600}.tick{fill:#dfe6eb;stroke:none}</style>
<rect width="1000" height="414" fill="#fff"/>
<text x="28" y="36" class="title">Best observed editing input</text>
<text x="28.00" y="61.00" class="small" text-anchor="start">13 tasks · 3 repetitions / profile · tokens · equal task weights</text>
<text x="28.00" y="82.00" class="small" text-anchor="start">Native best / xnip best: above 1x means less xnip input. Only all-repetition byte-exact profiles qualify.</text>
<text x="28.00" y="103.00" class="small" text-anchor="start">Same candidate permissions on both sides; separate xnip transports. Native candidates span transports.</text>
<text x="28.00" y="131.00" class="" text-anchor="start">xnip transport / contract</text>
<text x="663.00" y="131.00" class="" text-anchor="start">Input ratio</text>
<text x="786.00" y="131.00" class="" text-anchor="start">W / T / L / ?</text>
