<text x="28.00" y="157.00" class="" text-anchor="start">MCP · guarded</text>
<text x="663.00" y="157.00" class="" text-anchor="start">1.37x (13/13)</text>
<text x="786.00" y="157.00" class="" text-anchor="start">13 / 0 / 0 / 0</text>
<rect x="434.40" y="188" width="52.23" height="16" rx="3" fill="#b67418"/>
