<text x="28.00" y="354.00" class="small" text-anchor="start">W / T / L / ? = xnip shorter / tie / native shorter / missing comparison. Counts use tasks, not repetitions.</text>
<text x="28.00" y="372.00" class="small" text-anchor="start">Guarded: old content/context required. Snapshot-enabled: guarded edits + whole-file writes. Matching policies differ.</text>
<text x="28.00" y="390.00" class="small" text-anchor="start">Input only: CLI invocation and request envelopes are extra. Schemas/setup and full agent usage are excluded.</text>
<text x="28.00" y="408.00" class="small" text-anchor="start">Aider returned text is unknown; no returned-text or full-reply cost participates in this input chart.</text>
