[package]
name = "xnip-native-goose-bench"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

# This is deliberately independent from xnip's root workspace and lockfile.
[workspace]

[features]
otel = []

[dependencies]
rmcp = { version = "=3.4.1", default-features = false, features = ["schemars", "client", "server", "transport-child-process"] }
schemars = { version = "=1.2.2", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
async-trait = "=0.1.92"
tokio = { version = "=1.53.1", features = ["rt", "macros", "process", "time", "io-util"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
url = "=2.5.8"

[build-dependencies]
sha2 = "=0.10.9"
serde_json = "=1.0.151"

[profile.dev]
debug = false
