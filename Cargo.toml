[workspace]
members = [".", "xtask"]
default-members = ["."]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/SeaLoong/xnip"
authors = ["SeaLoong"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic relaxations for a CLI codebase
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
too_many_lines = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

[package]
name = "xnip"
version = "0.2.0"
description = "Precise text editing CLI for LLM agents"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["cli", "text", "editor", "agent", "llm"]
categories = ["command-line-utilities", "text-processing"]
default-run = "xnip"

[lib]
name = "xnip"
path = "src/lib.rs"

[[bin]]
name = "xnip"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive", "wrap_help"] }
regex = "1.12"
memchr = "2.8"
sha2 = "0.10.9"
tempfile = "3.27"
anyhow = "1.0.103"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
similar = "3.1"
is-terminal = "0.4"
nu-ansi-term = "0.50"
rayon = "1.12"

# MCP server 模式（`xnip mcp`）依赖：
# - rmcp: 官方 Rust SDK,server + macros 用于声明工具,transport-io 提供 stdio 传输
# - tokio: rmcp 的异步运行时;只启用 `rt`(单线程)避免 panic=abort 与多线程 worker 冲突
#   并降低同步 cli 路径无关代价(MCP stdio 单连接串行处理,无需多线程)
rmcp = { version = "1.7", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
# JsonSchema for MCP tool input schemas; rmcp 1.7 依赖同版本
schemars = "1.2"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"
criterion = { version = "0.8", features = ["html_reports"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"

[[bench]]
name = "large_file"
harness = false

[lints]
workspace = true
