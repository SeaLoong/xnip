# Scope and required-check policy: docs/ci.md.
name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_call:
    inputs:
      force_all:
        description: Run every check for an otherwise unverified release commit
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  XNIP_AUTO_UPDATE: "0"

jobs:
  scope:
    name: detect check and release scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      integrations: ${{ steps.scope.outputs.integrations }}
      full: ${{ steps.scope.outputs.full }}
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Plan default-branch development release
        id: release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          XNIP_BEFORE: ${{ github.event.before }}
          XNIP_HEAD: ${{ github.sha }}
          XNIP_RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -eu
          if [[ ! "$XNIP_BEFORE" =~ ^0+$ ]] && ! git cat-file -e "$XNIP_BEFORE^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$XNIP_BEFORE"
          fi
          python .github/scripts/release.py plan --before "$XNIP_BEFORE" --head "$XNIP_HEAD" --run-number "$XNIP_RUN_NUMBER" --github-output
      - name: Select checks from the complete Git diff
        id: scope
        env:
          XNIP_FORCE_ALL: ${{ inputs.force_all || steps.release.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -eu
          arguments=()
          if [ "$XNIP_FORCE_ALL" = true ]; then
            arguments+=(--force-all)
          fi
          python .github/scripts/ci_scope.py --event "$GITHUB_EVENT_PATH" --output "$GITHUB_OUTPUT" "${arguments[@]}"

  quality:
    name: Rust and integration quality
    needs: scope
    if: needs.scope.outputs.rust == 'true' || needs.scope.outputs.integrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format, lint, documentation and crate contents
        if: needs.scope.outputs.rust == 'true'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo doc --workspace --no-deps --locked
          cargo package --locked
      - name: Check generated integration assets
        if: needs.scope.outputs.integrations == 'true'
        run: |
          cargo run --locked -p xtask -- sync-integrations
          git diff --exit-code -- integrations/codex integrations/generic integrations/claude-code .github/skills/xnip-editing

  test:
    name: test (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cargo test includes doctests and builds the CLI used by installer tests.
      - run: cargo test --workspace --locked
      - name: Offline Windows installer contracts
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install_ps1.ps1

  compatibility:
    name: minimum Rust and dependency policy
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked
      - uses: EmbarkStudios/cargo-deny-action@v2

  contracts:
    name: automation and installer contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate workflows
        uses: docker://rhysd/actionlint:1.7.12
      - name: Offline script contracts
        run: |
          node --test tests/verified_ci_contract.cjs
          python tests/ci_scope_contract.py
          python tests/release_contract.py
          python tests/publish_release_contract.py
          python tests/native_benchmark_contract.py
          sh -n install.sh
          python tests/install_sh.py

  ci:
    name: ci
    needs: [scope, quality, test, compatibility, contracts]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected check to pass
        env:
          XNIP_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ["XNIP_NEEDS"])
          failed = {name: job["result"] for name, job in results.items()
                    if job["result"] not in ("success", "skipped")}
          if failed:
              raise SystemExit(f"Required checks did not pass: {failed}")
          required = {"scope", "contracts"}
          scope = results["scope"].get("outputs", {})
          if scope.get("rust") == "true":
              required.update(("quality", "test", "compatibility"))
          if scope.get("integrations") == "true":
              required.add("quality")
          if any(results[name]["result"] != "success" for name in required):
              raise SystemExit(f"Selected checks must run successfully: {sorted(required)}")
          if scope.get("full") == "true" and any(
              scope.get(name) != "true" for name in ("rust", "integrations")
          ):
              raise SystemExit("Full verification must enable every check")
          PY
      # release.yml only reuses successful gates carrying this marker.
      - name: Full verification
        if: needs.scope.outputs.full == 'true'
        run: echo "All release checks passed for this commit"

  prerelease:
    name: build and publish development release
    needs: [scope, ci]
    if: needs.scope.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/build-release.yml
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    with:
      version: ${{ needs.scope.outputs.version }}
      prerelease: true
      publish: true
