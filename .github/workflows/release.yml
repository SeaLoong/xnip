name: release

on:
  push:
    # Development tags are published by CI, including with an optional release token.
    tags: ['v*', '!v*-dev.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  XNIP_AUTO_UPDATE: "0"

jobs:
  checks:
    # The reusable CI declares a gated publisher; its actual check jobs stay read-only.
    permissions:
      contents: write
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify tag matches Cargo
        id: version
        env:
          XNIP_REF: ${{ github.ref }}
          XNIP_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -eu
          arguments=()
          if [[ "$XNIP_REF" == refs/tags/* ]]; then
            arguments+=(--tag "$XNIP_REF_NAME")
          fi
          python .github/scripts/release.py version --github-output "${arguments[@]}"

  artifacts:
    needs: [checks, version]
    permissions:
      contents: write
    uses: ./.github/workflows/build-release.yml
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
    with:
      version: ${{ needs.version.outputs.version }}
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
      publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
