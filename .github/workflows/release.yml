# Tag/manual entry point only. Default-branch development delivery is gated by ci.yml.
name: release

on:
  push:
    tags: ['v*', '!v*-dev.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  XNIP_AUTO_UPDATE: "0"

jobs:
  version:
    name: verify version and prior CI
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      reused: ${{ steps.ci.outputs.reused }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify tag matches Cargo
        id: version
        env:
          XNIP_REF: ${{ github.ref }}
          XNIP_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -eu
          arguments=()
          if [[ "$XNIP_REF" == refs/tags/* ]]; then
            arguments+=(--tag "$XNIP_REF_NAME")
          fi
          python .github/scripts/release.py version --github-output "${arguments[@]}"
      - name: Reuse complete default-branch checks for this exact commit
        id: ci
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const sha = execFileSync('git', ['rev-parse', 'HEAD^{commit}'], { encoding: 'utf8' }).trim();
            await require('./.github/scripts/verified_ci.cjs')({ github, context, core, sha });

  checks:
    name: verify untested release commit
    needs: version
    if: needs.version.outputs.reused != 'true'
    # ci.yml declares a gated development publisher, but tag/manual events cannot use it.
    # Its verification jobs explicitly keep contents: read and receive no release secret.
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/ci.yml
    with:
      force_all: true

  artifacts:
    needs: [version, checks]
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' &&
          (needs.version.outputs.reused == 'true' || needs.checks.result == 'success') }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/build-release.yml
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
    with:
      version: ${{ needs.version.outputs.version }}
      prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
      publish: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
