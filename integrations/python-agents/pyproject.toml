[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xnip-python-agents"
version = "0.6.0"
description = "xnip file tools for DeepAgents, LangGraph and PydanticAI"
requires-python = ">=3.11"
dependencies = ["xnip-native-client==0.6.0"]

[project.optional-dependencies]
deepagents = ["deepagents==0.7.34"]
langgraph = ["langgraph==1.2.20", "langchain-core==1.7.6"]
pydantic-ai = ["pydantic-ai-slim[mcp]==2.66.0", "mcp==2.3.0"]

[tool.setuptools.packages.find]
include = ["xnip_python_agents*"]
