[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xnip-openai-agents"
version = "0.6.4"
description = "xnip MCP tools for the OpenAI Agents SDK"
requires-python = ">=3.10"
dependencies = ["openai-agents==0.24.0", "mcp==1.30.0"]

[tool.setuptools]
py-modules = ["xnip_agents"]
