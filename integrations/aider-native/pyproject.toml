[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xnip-aider"
version = "0.6.2"
description = "Guarded xnip persistence for the pinned Aider Python scripting API"
requires-python = ">=3.13"
dependencies = [
  "xnip-native-client==0.6.2",
  "aider-chat @ git+https://github.com/Aider-AI/aider@5dc9490bb35f9729ef2c95d00a19ccd30c26339c",
]

[tool.setuptools]
py-modules = ["xnip_aider"]
