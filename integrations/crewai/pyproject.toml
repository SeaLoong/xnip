[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xnip-crewai"
version = "0.6.2"
description = "Official CrewAI MCP tools backed by xnip"
requires-python = ">=3.10,<3.14"
dependencies = ["crewai==1.15.36"]

[tool.setuptools]
py-modules = ["xnip_crewai"]
