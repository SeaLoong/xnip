[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xnip-google-adk"
version = "0.6.1"
description = "xnip MCP file tools for Google ADK applications"
requires-python = ">=3.11"
dependencies = ["google-adk[mcp]==2.13.0"]

[tool.setuptools]
py-modules = ["xnip_google_adk"]
